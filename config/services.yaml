# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    # 1. Configuration par défaut
    _defaults:
        autowire: true      # Injecte automatiquement les dépendances
        autoconfigure: true # Enregistre automatiquement les services

    # 2. Chargement automatique de toutes les classes dans src/
    App\:
        resource: '../src/'

    # 3. Injection explicite des variables (DOIT ETRE EN DERNIER pour surcharger le chargement auto)
    App\Service\TelegramService:
        arguments:
            $botToken: '%env(TELEGRAM_BOT_TOKEN)%'
            $chatId: '%env(TELEGRAM_CHAT_ID)%'
